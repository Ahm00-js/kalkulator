<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, system-ui, Arial, sans-serif;
      background: #eef2fa;
      color: #1d2a44;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { margin: 0; color: #0b1f4a; font-size: 1.5rem; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #2a5298;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .siri { grid-column: 1 / -1; }
    }
    .kartica {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      min-width: 0;
    }
    .kartica h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: #2a5298;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brojevi { display: flex; gap: 12px; flex-wrap: wrap; }
    .broj {
      flex: 1;
      min-width: 140px;
      background: #f4f7fc;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .broj .vrijednost { font-size: 1.8rem; font-weight: bold; color: #0b1f4a; }
    .broj .oznaka { font-size: 0.85rem; color: #6b7a99; }
    canvas { max-height: 320px; }
    .poruka { color: #c0392b; min-height: 1.2rem; }
    .zivo { font-size: 0.85rem; color: #2a5298; }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard</h1>
    <div>
      <span class="zivo" id="zivo"></span>
      <button id="odjava" type="button" hidden>Odjava</button>
    </div>
  </header>

  <section class="kartica" id="prijava" hidden style="max-width:400px;margin:0 auto;">
    <h2>Prijava (samo admin)</h2>
    <input type="email" id="email" placeholder="Email" style="width:100%;height:44px;padding:0 12px;margin-bottom:10px;">
    <input type="password" id="lozinka" placeholder="Lozinka" style="width:100%;height:44px;padding:0 12px;margin-bottom:10px;">
    <button id="prijavi" type="button" style="width:100%;height:44px;">Prijavi se</button>
    <p class="poruka" id="porukaPrijava"></p>
  </section>

  <div class="grid" id="sadrzaj" hidden>
    <section class="kartica siri">
      <h2>Pregled</h2>
      <div class="brojevi">
        <div class="broj"><div class="vrijednost" id="ukupno">0</div><div class="oznaka">Ukupno računa</div></div>
        <div class="broj"><div class="vrijednost" id="danas">0</div><div class="oznaka">Danas</div></div>
        <div class="broj"><div class="vrijednost" id="najcesca">–</div><div class="oznaka">Najčešća operacija</div></div>
      </div>
    </section>

    <section class="kartica">
      <h2>Računa po danu</h2>
      <canvas id="grafDan"></canvas>
    </section>

    <section class="kartica">
      <h2>Operacije</h2>
      <canvas id="grafOp"></canvas>
    </section>

    <p class="poruka" id="porukaGreska"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script-dashboard.js"></script>
</body>
</html>
