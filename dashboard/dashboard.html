<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4a">
  <title>Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    :root {
      --tamna: #0b1f4a;
      --plava: #2a5298;
      --svijetla: #5fa8ff;
      --bijela: #ffffff;
      --kartica: rgba(255, 255, 255, 0.94);
      --tekst: #1d2a44;
      --tekst-blijed: #6b7a99;
      --linija: rgba(42, 82, 152, 0.12);
      --polje: #f3f6fc;
      --radius: 22px;
      --sidebar: #0b1f4a;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
      color: var(--tekst);
      background: linear-gradient(135deg, #eef3fc, #dfe9fa 60%, #cfe0fb);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .layout { display: flex; min-height: 100vh; min-height: 100dvh; }

    aside {
      width: 240px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #0b1f4a, #14316b);
      color: #fff;
      padding: 26px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 4px 0 30px rgba(11, 31, 74, 0.25);
    }
    aside h1 {
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 22px 10px;
    }

    .nav-btn {
      text-align: left;
      background: transparent;
      color: #c9d6f0;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background 0.2s, color 0.2s, transform 0.12s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .nav-btn:active { transform: scale(0.98); }
    .nav-btn.aktivan {
      background: linear-gradient(135deg, #2a5298, #5fa8ff);
      color: #fff;
      box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4);
    }

    .sadrzaj { flex: 1; padding: 30px; min-width: 0; }

    h2.naslov {
      margin: 0 0 22px;
      color: var(--tamna);
      font-size: 1.6rem;
      font-weight: 700;
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--plava), var(--svijetla));
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(42, 82, 152, 0.3);
      transition: transform 0.12s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.97); }
    button.mala { background: var(--polje); color: var(--plava); box-shadow: none; }
    button.opasnost { background: #fdecea; color: #c0392b; box-shadow: none; }
    button.zuta { background: #fff4d6; color: #8a6100; box-shadow: none; }

    select, input {
      padding: 10px 14px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--polje);
      color: var(--tekst);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--plava); box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15); }

    .kartica {
      background: var(--kartica);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 18px 44px rgba(11, 31, 74, 0.12);
      margin-bottom: 20px;
      min-width: 0;
    }
    .kartica h3 {
      margin: 0 0 14px;
      font-size: 0.85rem;
      color: var(--plava);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .filteri { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }

    .grid2 { display: grid; gap: 20px; grid-template-columns: 1fr; }
    @media (min-width: 1000px) { .grid2 { grid-template-columns: 1fr 1fr; } }

    .brojevi { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .broj {
      background: linear-gradient(135deg, #ffffff, #f1f5fd);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: inset 0 0 0 1px var(--linija);
    }
    .broj .vrijednost { font-size: 2rem; font-weight: 700; color: var(--tamna); }
    .broj .oznaka { font-size: 0.85rem; color: var(--tekst-blijed); margin-top: 4px; }

    canvas { max-height: 320px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e6ecf6; }
    th {
      color: var(--plava);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    tr:hover td { background: #f7f9fe; }
    td input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--plava); padding: 0; }
    td input[type="checkbox"]:disabled { opacity: 0.35; cursor: not-allowed; }

    .badge { font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .badge.da { background: #e3f6ea; color: #1e7b44; }
    .badge.ne { background: #fdecea; color: #c0392b; }

    .admini { list-style: none; padding: 0; margin: 0 0 16px; }
    .admini li {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--polje); border-radius: 14px; padding: 12px 16px; margin-bottom: 8px;
    }
    .dodaj { display: flex; gap: 10px; flex-wrap: wrap; }
    .dodaj input { flex: 1; min-width: 220px; }

    .poruka { color: #c0392b; min-height: 1.2rem; margin: 10px 0 0; font-size: 0.92rem; }
    .zivo { font-size: 0.85rem; color: #9fd8b5; margin-bottom: 10px; }
    .tabela-wrap { overflow-x: auto; }

    .prijava-kutija {
      max-width: 420px; margin: 70px auto; padding: 32px;
    }
    .prijava-kutija h3 { font-size: 1rem; text-align: center; color: var(--tamna); }
    .prijava-kutija input { width: 100%; height: 52px; margin-bottom: 12px; }
    .prijava-kutija button { width: 100%; height: 52px; font-size: 1rem; }

    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      aside { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px; gap: 8px; }
      aside h1 { margin: 0 8px 0 0; font-size: 1rem; }
      .nav-btn { padding: 9px 12px; font-size: 0.85rem; }
      .zivo { display: none; }
      .sadrzaj { padding: 18px; }
      h2.naslov { font-size: 1.3rem; }
      .kartica { padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <section class="kartica prijava-kutija" id="prijava" hidden>
    <h3>Prijava (samo admin)</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="lozinka" placeholder="Lozinka">
    <button id="prijavi" type="button">Prijavi se</button>
    <p class="poruka" id="porukaPrijava"></p>
  </section>

  <div class="layout" id="sadrzaj" hidden>
    <aside>
      <h1>Kalkulator</h1>
      <a class="nav-btn" href="../index.html">← Kalkulator</a>
      <button class="nav-btn aktivan" data-tab="pregled">Pregled</button>
      <button class="nav-btn" data-tab="racuni">Računi</button>
      <button class="nav-btn" data-tab="izvjestaji">Izvještaji</button>
      <button class="nav-btn" data-tab="admini">Admini</button>
      <div style="margin-top:auto;">
        <div class="zivo" id="zivo"></div>
        <button class="mala" id="odjava" type="button">Odjava</button>
      </div>
    </aside>

    <main class="sadrzaj">
      <h2 class="naslov" id="naslov">Pregled</h2>

      <div class="tab" id="tab-pregled">
        <div class="filteri">
          <select id="periodPregled" aria-label="Period">
            <option value="7">Zadnjih 7 dana</option>
            <option value="30">Zadnjih 30 dana</option>
            <option value="">Sve</option>
          </select>
          <select id="korisnikPregled" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
        </div>
        <div class="kartica">
          <div class="brojevi">
            <div class="broj"><div class="vrijednost" id="ukupno">0</div><div class="oznaka">Računa u periodu</div></div>
            <div class="broj"><div class="vrijednost" id="danas">0</div><div class="oznaka">Danas</div></div>
            <div class="broj"><div class="vrijednost" id="najcesca">–</div><div class="oznaka">Najčešća operacija</div></div>
          </div>
        </div>
        <div class="grid2">
          <div class="kartica"><h3>Računa po danu</h3><canvas id="grafDan"></canvas></div>
          <div class="kartica"><h3>Operacije</h3><canvas id="grafOp"></canvas></div>
        </div>
      </div>

      <div class="tab" id="tab-racuni" hidden>
        <div class="filteri">
          <select id="periodRacuni" aria-label="Period">
            <option value="7">Zadnjih 7 dana</option>
            <option value="30">Zadnjih 30 dana</option>
            <option value="">Sve</option>
          </select>
          <select id="korisnikRacuni" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
        </div>
        <div class="kartica tabela-wrap">
          <table>
            <thead><tr><th>Datum</th><th>Korisnik</th><th>Izraz</th><th>Rezultat</th></tr></thead>
            <tbody id="tbodyRacuni"></tbody>
          </table>
        </div>
      </div>

      <div class="tab" id="tab-izvjestaji" hidden>
        <div class="kartica">
          <h3>Izvoz CSV</h3>
          <div class="filteri">
            <select id="periodIzvj" aria-label="Period">
              <option value="7">Zadnjih 7 dana</option>
              <option value="30">Zadnjih 30 dana</option>
              <option value="">Sve</option>
            </select>
            <select id="korisnikIzvj" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
            <button id="izvezi" type="button">Preuzmi CSV</button>
          </div>
        </div>
      </div>

      <div class="tab" id="tab-admini" hidden>
        <div class="kartica tabela-wrap">
          <h3>Korisnici i dozvole</h3>
          <table>
            <thead>
              <tr>
                <th>Email</th><th>Admin</th><th>Pregled</th><th>Računi</th><th>Izvještaji</th><th>Admini</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody id="tbodyAdmini"></tbody>
          </table>
          <p class="poruka" id="porukaAdmin"></p>
        </div>
        <div class="kartica tabela-wrap">
          <h3>Audit log (zadnjih 100)</h3>
          <table class="audit">
            <thead><tr><th>Datum</th><th>Ko</th><th>Akcija</th><th>Detalji</th></tr></thead>
            <tbody id="tbodyAudit"></tbody>
          </table>
        </div>
      </div>

      <p class="poruka" id="porukaGreska"></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script-dashboard.js"></script>
</body>
</html>
