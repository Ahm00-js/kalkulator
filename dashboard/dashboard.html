<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, system-ui, Arial, sans-serif;
      background: #eef2fa;
      color: #1d2a44;
    }
    .layout { display: flex; min-height: 100vh; }
    aside {
      width: 220px;
      flex-shrink: 0;
      background: #0b1f4a;
      color: #fff;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    aside h1 { font-size: 1.2rem; margin: 0 0 16px 8px; }
    .nav-btn {
      text-align: left;
      background: transparent;
      color: #c9d6f0;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-btn.aktivan { background: #2a5298; color: #fff; }
    .sadrzaj { flex: 1; padding: 24px; min-width: 0; }
    h2.naslov { margin: 0 0 18px; color: #0b1f4a; font-size: 1.4rem; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #2a5298;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.mala { background: #dce7fb; color: #2a5298; }
    button.opasnost { background: #fdecea; color: #c0392b; }
    button.zuta { background: #fff4d6; color: #8a6100; }
    select, input {
      padding: 8px 10px;
      border: 2px solid #d7deea;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      color: #1d2a44;
    }
    .kartica {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 18px;
      min-width: 0;
    }
    .kartica h3 {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: #2a5298;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
    @media (min-width: 1000px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .brojevi { display: flex; gap: 12px; flex-wrap: wrap; }
    .broj { flex: 1; min-width: 140px; background: #f4f7fc; border-radius: 12px; padding: 16px; text-align: center; }
    .broj .vrijednost { font-size: 1.8rem; font-weight: bold; color: #0b1f4a; }
    .broj .oznaka { font-size: 0.85rem; color: #6b7a99; }
    canvas { max-height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5eaf3; }
    th { color: #2a5298; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    td input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    td input[type="checkbox"]:disabled { opacity: 0.35; cursor: not-allowed; }
    .badge { font-size: 0.8rem; padding: 3px 8px; border-radius: 8px; }
    .badge.da { background: #e3f6ea; color: #1e7b44; }
    .badge.ne { background: #fdecea; color: #c0392b; }
    .filteri { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .poruka { color: #c0392b; min-height: 1.2rem; margin: 8px 0 0; }
    .zivo { font-size: 0.85rem; color: #c9d6f0; margin-bottom: 8px; }
    .prijava-kutija { max-width: 400px; margin: 60px auto; }
    .prijava-kutija input { width: 100%; height: 44px; margin-bottom: 10px; }
    .prijava-kutija button { width: 100%; height: 44px; }
    .tabela-wrap { overflow-x: auto; }
    .audit td { font-size: 0.88rem; }
    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      aside { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
      aside h1 { margin: 0 10px 0 0; font-size: 1rem; }
      .nav-btn { padding: 8px 10px; font-size: 0.85rem; }
      .zivo { display: none; }
    }
  </style>
</head>
<body>
  <section class="kartica prijava-kutija" id="prijava" hidden>
    <h3>Prijava (samo admin)</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="lozinka" placeholder="Lozinka">
    <button id="prijavi" type="button">Prijavi se</button>
    <p class="poruka" id="porukaPrijava"></p>
  </section>

  <div class="layout" id="sadrzaj" hidden>
    <aside>
      <h1>Kalkulator</h1>
      <button class="nav-btn aktivan" data-tab="pregled">Pregled</button>
      <button class="nav-btn" data-tab="racuni">Računi</button>
      <button class="nav-btn" data-tab="izvjestaji">Izvještaji</button>
      <button class="nav-btn" data-tab="admini">Admini</button>
      <div style="margin-top:auto;">
        <div class="zivo" id="zivo"></div>
        <button class="mala" id="odjava" type="button">Odjava</button>
      </div>
    </aside>

    <main class="sadrzaj">
      <h2 class="naslov" id="naslov">Pregled</h2>

      <div class="tab" id="tab-pregled">
        <div class="filteri">
          <select id="periodPregled" aria-label="Period">
            <option value="7">Zadnjih 7 dana</option>
            <option value="30">Zadnjih 30 dana</option>
            <option value="">Sve</option>
          </select>
          <select id="korisnikPregled" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
        </div>
        <div class="kartica">
          <div class="brojevi">
            <div class="broj"><div class="vrijednost" id="ukupno">0</div><div class="oznaka">Računa u periodu</div></div>
            <div class="broj"><div class="vrijednost" id="danas">0</div><div class="oznaka">Danas</div></div>
            <div class="broj"><div class="vrijednost" id="najcesca">–</div><div class="oznaka">Najčešća operacija</div></div>
          </div>
        </div>
        <div class="grid2">
          <div class="kartica"><h3>Računa po danu</h3><canvas id="grafDan"></canvas></div>
          <div class="kartica"><h3>Operacije</h3><canvas id="grafOp"></canvas></div>
        </div>
      </div>

      <div class="tab" id="tab-racuni" hidden>
        <div class="filteri">
          <select id="periodRacuni" aria-label="Period">
            <option value="7">Zadnjih 7 dana</option>
            <option value="30">Zadnjih 30 dana</option>
            <option value="">Sve</option>
          </select>
          <select id="korisnikRacuni" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
        </div>
        <div class="kartica tabela-wrap">
          <table>
            <thead><tr><th>Datum</th><th>Korisnik</th><th>Izraz</th><th>Rezultat</th></tr></thead>
            <tbody id="tbodyRacuni"></tbody>
          </table>
        </div>
      </div>

      <div class="tab" id="tab-izvjestaji" hidden>
        <div class="kartica">
          <h3>Izvoz CSV</h3>
          <div class="filteri">
            <select id="periodIzvj" aria-label="Period">
              <option value="7">Zadnjih 7 dana</option>
              <option value="30">Zadnjih 30 dana</option>
              <option value="">Sve</option>
            </select>
            <select id="korisnikIzvj" aria-label="Korisnik"><option value="">Svi korisnici</option></select>
            <button id="izvezi" type="button">Preuzmi CSV</button>
          </div>
        </div>
      </div>

      <div class="tab" id="tab-admini" hidden>
        <div class="kartica tabela-wrap">
          <h3>Korisnici i dozvole</h3>
          <table>
            <thead>
              <tr>
                <th>Email</th><th>Admin</th><th>Pregled</th><th>Računi</th><th>Izvještaji</th><th>Admini</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody id="tbodyAdmini"></tbody>
          </table>
          <p class="poruka" id="porukaAdmin"></p>
        </div>
        <div class="kartica tabela-wrap">
          <h3>Audit log (zadnjih 100)</h3>
          <table class="audit">
            <thead><tr><th>Datum</th><th>Ko</th><th>Akcija</th><th>Detalji</th></tr></thead>
            <tbody id="tbodyAudit"></tbody>
          </table>
        </div>
      </div>

      <p class="poruka" id="porukaGreska"></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script-dashboard.js"></script>
</body>
</html>
