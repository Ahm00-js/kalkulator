<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --plava-tamna: #0b1f4a;
      --plava: #2a5298;
      --plava-svijetla: #5fa8ff;
      --bijela: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0b1f4a, #2a5298, #5fa8ff);
      background-size: 300% 300%;
      animation: pozadina 14s ease infinite;
      overflow: hidden;
    }

    @keyframes pozadina {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .krug {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      animation: lebdi 12s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .krug:nth-child(1) { width: 260px; height: 260px; top: -60px; left: -60px; }
    .krug:nth-child(2) { width: 180px; height: 180px; bottom: -40px; right: -40px; animation-delay: -4s; }
    .krug:nth-child(3) { width: 120px; height: 120px; top: 40%; right: 10%; animation-delay: -8s; }

    @keyframes lebdi {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.08); }
    }

    .kalkulator {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 26px 22px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      animation: ulazak 0.7s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes ulazak {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.6rem;
      text-align: center;
      color: var(--plava-tamna);
      letter-spacing: 1px;
      animation: sjaj 3s ease-in-out infinite;
    }

    @keyframes sjaj {
      0%, 100% { text-shadow: 0 0 0 rgba(42, 82, 152, 0); }
      50% { text-shadow: 0 0 14px rgba(42, 82, 152, 0.45); }
    }

    .red {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    .red input {
      flex: 1;
      min-width: 0;
      height: 56px;
      padding: 0 12px;
      font-size: 1.3rem;
      text-align: right;
      border: 2px solid #d0d7e2;
      border-radius: 14px;
      background: #f7f9fd;
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.15s;
    }

    .red input.aktivno {
      border-color: var(--plava);
      box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.18);
    }

    select {
      width: 60px;
      height: 56px;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      color: var(--plava);
      border: 2px solid #d0d7e2;
      border-radius: 14px;
      background: #f7f9fd;
      outline: none;
    }

    .tastatura {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .tipka {
      height: 60px;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--plava-tamna);
      background: #eef2fa;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #c8d3e6;
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
      touch-action: manipulation;
      user-select: none;
    }

    .tipka:hover { background: #e0e8f7; }

    .tipka:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #c8d3e6;
    }

    .tipka.op { color: var(--plava); background: #dce7fb; }
    .tipka.fn { color: #c0392b; background: #fdecea; }

    #izracunaj {
      grid-column: 4;
      grid-row: 4 / span 2;
      height: auto;
      font-size: 1.8rem;
      color: var(--bijela);
      background: linear-gradient(135deg, var(--plava), var(--plava-svijetla));
      background-size: 200% 200%;
      box-shadow: 0 6px 16px rgba(42, 82, 152, 0.4);
      position: relative;
      overflow: hidden;
    }

    #izracunaj:hover {
      background-position: 100% 0;
      box-shadow: 0 8px 20px rgba(42, 82, 152, 0.5);
    }

    #izracunaj:active { transform: scale(0.96); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    #rezultat {
      margin: 18px 0 0;
      min-height: 2.4rem;
      font-size: 2rem;
      font-weight: bold;
      text-align: right;
      color: var(--plava-tamna);
      word-break: break-all;
    }

    #rezultat.pojavi {
      animation: pojavi 0.5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes pojavi {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      margin: 22px 0 10px;
      font-size: 1rem;
      color: var(--plava);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #istorija {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 280px;
      overflow-y: auto;
    }

    #istorija li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #f7f9fd;
      border-radius: 12px;
      animation: ulazak 0.4s ease both;
    }

    #istorija .izraz {
      font-size: 1.1rem;
      color: #333;
      font-variant-numeric: tabular-nums;
    }

    #istorija .rez {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--plava-tamna);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 420px) {
      .kalkulator { padding: 20px 14px; }
      .red input { font-size: 1.15rem; }
      select { width: 52px; }
      .tipka { height: 54px; font-size: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="krug"></div>
  <div class="krug"></div>
  <div class="krug"></div>

  <div class="kalkulator">
    <h1>Kalkulator</h1>

    <div class="red">
      <input type="text" id="a" inputmode="decimal" readonly placeholder="0">
      <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input type="text" id="b" inputmode="decimal" readonly placeholder="0">
    </div>

    <div class="tastatura">
      <button class="tipka fn" data-k="C">C</button>
      <button class="tipka fn" data-k="⌫">⌫</button>
      <button class="tipka op" data-k="/">÷</button>
      <button class="tipka op" data-k="*">×</button>

      <button class="tipka" data-k="7">7</button>
      <button class="tipka" data-k="8">8</button>
      <button class="tipka" data-k="9">9</button>
      <button class="tipka op" data-k="-">−</button>

      <button class="tipka" data-k="4">4</button>
      <button class="tipka" data-k="5">5</button>
      <button class="tipka" data-k="6">6</button>
      <button class="tipka op" data-k="+">+</button>

      <button class="tipka" data-k="1">1</button>
      <button class="tipka" data-k="2">2</button>
      <button class="tipka" data-k="3">3</button>
      <button id="izracunaj">=</button>

      <button class="tipka" data-k="0" style="grid-column: span 2;">0</button>
      <button class="tipka" data-k=".">.</button>
    </div>

    <p id="rezultat"></p>

    <h2>Zadnjih 10 računa</h2>
    <ul id="istorija"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    const dugme = document.getElementById("izracunaj");
    dugme.addEventListener("click", (e) => {
      const r = dugme.getBoundingClientRect();
      const span = document.createElement("span");
      const d = Math.max(r.width, r.height);
      span.className = "ripple";
      span.style.width = span.style.height = d + "px";
      span.style.left = (e.clientX - r.left - d / 2) + "px";
      span.style.top = (e.clientY - r.top - d / 2) + "px";
      dugme.appendChild(span);
      setTimeout(() => span.remove(), 600);
    });

    const rez = document.getElementById("rezultat");
    new MutationObserver(() => {
      rez.classList.remove("pojavi");
      void rez.offsetWidth;
      rez.classList.add("pojavi");
    }).observe(rez, { childList: true, characterData: true, subtree: true });
  </script>
</body>
</html>
