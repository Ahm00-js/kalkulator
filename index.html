<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4a">
  <title>Kalkulator</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --tamna: #0b1f4a;
      --plava: #2a5298;
      --svijetla: #5fa8ff;
      --bijela: #ffffff;
      --pozadina-kartica: rgba(255, 255, 255, 0.97);
      --tekst: #1d2a44;
      --tekst-blijed: #6b7a99;
      --linija: #d7deea;
      --polje: #f4f7fc;
      --tipka: #eef2fa;
      --tipka-hover: #e0e8f7;
      --op-bg: #dce7fb;
      --fn-bg: #fdecea;
      --fn-tekst: #c0392b;
      --radius: 20px;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
      color: var(--tekst);
      background: linear-gradient(135deg, #0b1f4a, #2a5298, #5fa8ff);
      background-size: 300% 300%;
      animation: pozadina 16s ease infinite;
      overflow-x: hidden;
    }

    @keyframes pozadina {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .krug {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      animation: lebdi 14s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .krug:nth-child(1) { width: min(60vw, 300px); aspect-ratio: 1; top: -8%; left: -10%; }
    .krug:nth-child(2) { width: min(45vw, 220px); aspect-ratio: 1; bottom: -6%; right: -8%; animation-delay: -5s; }
    .krug:nth-child(3) { width: min(30vw, 140px); aspect-ratio: 1; top: 45%; right: 8%; animation-delay: -9s; }

    @keyframes lebdi {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.08); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: grid;
      gap: 18px;
      animation: ulazak 0.7s cubic-bezier(.2,.8,.2,1) both;
    }

    @media (min-width: 900px) {
      .wrap {
        max-width: 880px;
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }

    @keyframes ulazak {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .kartica {
      background: var(--pozadina-kartica);
      border-radius: var(--radius);
      padding: clamp(18px, 4vw, 28px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      min-width: 0;
    }

    h1 {
      margin: 0 0 clamp(14px, 3vw, 20px);
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      text-align: center;
      color: var(--tamna);
      letter-spacing: 1px;
      animation: sjaj 3.5s ease-in-out infinite;
    }

    @keyframes sjaj {
      0%, 100% { text-shadow: 0 0 0 rgba(42, 82, 152, 0); }
      50% { text-shadow: 0 0 14px rgba(42, 82, 152, 0.4); }
    }

    .red {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: clamp(6px, 2vw, 10px);
      align-items: stretch;
    }

    .red input {
      width: 100%;
      min-width: 0;
      height: clamp(52px, 12vw, 60px);
      padding: 0 clamp(10px, 3vw, 14px);
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      text-align: right;
      color: var(--tekst);
      border: 2px solid var(--linija);
      border-radius: 14px;
      background: var(--polje);
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .red input.aktivno {
      border-color: var(--plava);
      box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.16);
    }

    select {
      width: clamp(52px, 14vw, 64px);
      height: clamp(52px, 12vw, 60px);
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      font-weight: bold;
      text-align: center;
      color: var(--plava);
      border: 2px solid var(--linija);
      border-radius: 14px;
      background: var(--polje);
      outline: none;
      cursor: pointer;
    }

    .tastatura {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
      margin-top: 16px;
    }

    .tipka {
      min-height: clamp(54px, 13vw, 64px);
      font-family: inherit;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      font-weight: 600;
      color: var(--tamna);
      background: var(--tipka);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #c8d3e6;
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
      touch-action: manipulation;
      user-select: none;
    }

    @media (hover: hover) {
      .tipka:hover { background: var(--tipka-hover); }
    }

    .tipka:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #c8d3e6;
    }

    .tipka.op { color: var(--plava); background: var(--op-bg); }
    .tipka.fn { color: var(--fn-tekst); background: var(--fn-bg); }

    #izracunaj {
      grid-column: 1 / -1;
      min-height: clamp(56px, 13vw, 66px);
      font-size: clamp(1.6rem, 5vw, 2rem);
      color: var(--bijela);
      background: linear-gradient(135deg, var(--plava), var(--svijetla));
      background-size: 200% 200%;
      box-shadow: 0 6px 16px rgba(42, 82, 152, 0.4);
      position: relative;
      overflow: hidden;
    }

    @media (hover: hover) {
      #izracunaj:hover {
        background-position: 100% 0;
        box-shadow: 0 8px 22px rgba(42, 82, 152, 0.5);
      }
    }

    #izracunaj:active { transform: scale(0.98); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    #rezultat {
      margin: 16px 0 0;
      min-height: 2.4rem;
      font-size: clamp(1.6rem, 6vw, 2.1rem);
      font-weight: bold;
      text-align: right;
      color: var(--tamna);
      word-break: break-all;
    }

    #rezultat.pojavi {
      animation: pojavi 0.5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes pojavi {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--plava);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #istorija {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: min(60vh, 480px);
      overflow-y: auto;
    }

    #istorija li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--polje);
      border-radius: 12px;
      animation: ulazak 0.4s ease both;
    }

    #istorija .izraz {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: #333;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #istorija .rez {
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: bold;
      color: var(--tamna);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #istorija .prazno {
      font-size: 0.95rem;
      color: var(--tekst-blijed);
      background: none;
      padding: 8px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="krug"></div>
  <div class="krug"></div>
  <div class="krug"></div>

  <main class="wrap">
    <section class="kartica">
      <h1>Kalkulator</h1>

      <div class="red">
        <input type="text" id="a" inputmode="decimal" readonly placeholder="0">
        <select id="op" aria-label="Operacija">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
        <input type="text" id="b" inputmode="decimal" readonly placeholder="0">
      </div>

      <div class="tastatura">
        <button class="tipka fn" data-k="C">C</button>
        <button class="tipka fn" data-k="⌫">⌫</button>
        <button class="tipka op" data-k="√">√</button>
        <button class="tipka op" data-k="%">%</button>

        <button class="tipka" data-k="7">7</button>
        <button class="tipka" data-k="8">8</button>
        <button class="tipka" data-k="9">9</button>
        <button class="tipka op" data-k="/">÷</button>

        <button class="tipka" data-k="4">4</button>
        <button class="tipka" data-k="5">5</button>
        <button class="tipka" data-k="6">6</button>
        <button class="tipka op" data-k="*">×</button>

        <button class="tipka" data-k="1">1</button>
        <button class="tipka" data-k="2">2</button>
        <button class="tipka" data-k="3">3</button>
        <button class="tipka op" data-k="-">−</button>

        <button class="tipka" data-k="0" style="grid-column: span 2;">0</button>
        <button class="tipka" data-k=".">.</button>
        <button class="tipka op" data-k="+">+</button>

        <button id="izracunaj">=</button>
      </div>

      <p id="rezultat" aria-live="polite"></p>
    </section>

    <section class="kartica">
      <h2>Zadnjih 10 računa</h2>
      <ul id="istorija"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    const dugme = document.getElementById("izracunaj");
    dugme.addEventListener("click", (e) => {
      const r = dugme.getBoundingClientRect();
      const span = document.createElement("span");
      const d = Math.max(r.width, r.height);
      span.className = "ripple";
      span.style.width = span.style.height = d + "px";
      span.style.left = (e.clientX - r.left - d / 2) + "px";
      span.style.top = (e.clientY - r.top - d / 2) + "px";
      dugme.appendChild(span);
      setTimeout(() => span.remove(), 600);
    });

    const rez = document.getElementById("rezultat");
    new MutationObserver(() => {
      rez.classList.remove("pojavi");
      void rez.offsetWidth;
      rez.classList.add("pojavi");
    }).observe(rez, { childList: true, characterData: true, subtree: true });
  </script>
</body>
</html>
