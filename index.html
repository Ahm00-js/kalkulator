<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4a">
  <title>Kalkulator</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    :root {
      --tamna: #0b1f4a;
      --plava: #2a5298;
      --svijetla: #5fa8ff;
      --bijela: #ffffff;
      --kartica: rgba(255, 255, 255, 0.97);
      --tekst: #1d2a44;
      --tekst-blijed: #6b7a99;
      --linija: #d7deea;
      --polje: #f4f7fc;
      --tipka: #eef2fa;
      --tipka-hover: #e0e8f7;
      --tipka-sjena: #c8d3e6;
      --op-bg: #dce7fb;
      --fn-bg: #fdecea;
      --fn-tekst: #c0392b;
      --radius: 20px;
    }

    body.tamna {
      --tamna: #e6ecf7;
      --kartica: rgba(20, 28, 48, 0.96);
      --tekst: #e6ecf7;
      --tekst-blijed: #8fa0c4;
      --linija: #34456a;
      --polje: #1c2740;
      --tipka: #1f2b45;
      --tipka-hover: #2a3a5c;
      --tipka-sjena: #0d1424;
      --op-bg: #22386a;
      --fn-bg: #3a2326;
      --fn-tekst: #ff8a80;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
      color: var(--tekst);
      background: linear-gradient(135deg, #0b1f4a, #2a5298, #5fa8ff);
      background-size: 300% 300%;
      animation: pozadina 16s ease infinite;
      overflow-x: hidden;
    }

    body.tamna {
      background: linear-gradient(135deg, #050b1a, #0f1d3a, #1d3566);
      background-size: 300% 300%;
    }

    @keyframes pozadina {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .krug {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      animation: lebdi 14s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .krug:nth-child(1) { width: min(60vw, 300px); aspect-ratio: 1; top: -8%; left: -10%; }
    .krug:nth-child(2) { width: min(45vw, 220px); aspect-ratio: 1; bottom: -6%; right: -8%; animation-delay: -5s; }
    .krug:nth-child(3) { width: min(30vw, 140px); aspect-ratio: 1; top: 45%; right: 8%; animation-delay: -9s; }

    @keyframes lebdi {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.08); }
    }

    /* Gornja traka */
    .top {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--bijela);
      font-size: 0.9rem;
    }
    .top-dugmad { display: flex; gap: 8px; margin-left: auto; }
    #korisnik { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    .mali {
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--tamna);
      background: rgba(255, 255, 255, 0.92);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Kartice i raspored */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: grid;
      gap: 18px;
      animation: ulazak 0.7s cubic-bezier(.2,.8,.2,1) both;
    }

    @media (min-width: 900px) {
      .wrap, .top { max-width: 880px; }
      .wrap { grid-template-columns: 1fr 1fr; align-items: start; }
    }

    @keyframes ulazak {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .kartica {
      background: var(--kartica);
      color: var(--tekst);
      border-radius: var(--radius);
      padding: clamp(18px, 4vw, 28px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      min-width: 0;
    }

    h1 {
      margin: 0 0 clamp(14px, 3vw, 20px);
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      text-align: center;
      color: var(--tamna);
      letter-spacing: 1px;
      animation: sjaj 3.5s ease-in-out infinite;
    }

    @keyframes sjaj {
      0%, 100% { text-shadow: 0 0 0 rgba(42, 82, 152, 0); }
      50% { text-shadow: 0 0 14px rgba(42, 82, 152, 0.4); }
    }

    /* Prijava */
    .auth {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: ulazak 0.7s cubic-bezier(.2,.8,.2,1) both;
    }
    .auth input {
      height: 52px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--tekst);
      background: var(--polje);
      border: 2px solid var(--linija);
      border-radius: 14px;
      outline: none;
    }
    .auth input:focus { border-color: var(--plava); box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.16); }

    .akcija, .sekundarno {
      height: 52px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      border: none;
    }
    .akcija { color: var(--bijela); background: linear-gradient(135deg, var(--plava), var(--svijetla)); }
    .sekundarno { color: var(--plava); background: var(--op-bg); }

    .poruka { margin: 0; min-height: 1.2rem; font-size: 0.95rem; color: #c0392b; text-align: center; }

    /* Ekran */
    .ekran {
      width: 100%;
      height: clamp(58px, 13vw, 68px);
      padding: 0 clamp(12px, 3vw, 16px);
      font-family: inherit;
      font-size: clamp(1.3rem, 4.5vw, 1.7rem);
      text-align: right;
      color: var(--tekst);
      background: var(--polje);
      border: 2px solid var(--plava);
      border-radius: 14px;
      box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.16);
      outline: none;
    }

    /* Tastatura */
    .tastatura {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
      margin-top: 16px;
    }

    .tipka {
      min-height: clamp(54px, 13vw, 64px);
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 600;
      color: var(--tamna);
      background: var(--tipka);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--tipka-sjena);
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
      touch-action: manipulation;
      user-select: none;
    }

    @media (hover: hover) {
      .tipka:hover { background: var(--tipka-hover); }
    }

    .tipka:active { transform: translateY(3px); box-shadow: 0 0 0 var(--tipka-sjena); }
    .tipka.op { color: var(--plava); background: var(--op-bg); }
    .tipka.fn { color: var(--fn-tekst); background: var(--fn-bg); }

    #izracunaj {
      grid-column: 1 / -1;
      min-height: clamp(56px, 13vw, 66px);
      font-family: inherit;
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: bold;
      color: var(--bijela);
      background: linear-gradient(135deg, var(--plava), var(--svijetla));
      background-size: 200% 200%;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(42, 82, 152, 0.4);
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      #izracunaj:hover { background-position: 100% 0; box-shadow: 0 8px 22px rgba(42, 82, 152, 0.5); }
    }

    #izracunaj:active { transform: scale(0.98); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    #rezultat {
      margin: 16px 0 0;
      min-height: 2.4rem;
      font-size: clamp(1.6rem, 6vw, 2.1rem);
      font-weight: bold;
      text-align: right;
      color: var(--tamna);
      word-break: break-all;
    }

    #rezultat.pojavi { animation: pojavi 0.5s cubic-bezier(.2,.8,.2,1); }

    @keyframes pojavi {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Historija */
    h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--plava);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #istorija {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: min(60vh, 480px);
      overflow-y: auto;
    }

    #istorija li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--polje);
      border-radius: 12px;
      animation: ulazak 0.4s ease both;
    }

    #istorija .izraz {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: var(--tekst);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    #istorija .desno { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    #istorija .rez {
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: bold;
      color: var(--tamna);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #istorija .brisi {
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--fn-tekst);
      background: var(--fn-bg);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    #istorija .prazno {
      font-size: 0.95rem;
      color: var(--tekst-blijed);
      background: none;
      padding: 8px 0;
    }

    @media (max-width: 420px) {
      .kartica { padding: 18px 14px; }
      .tipka { font-size: 1.15rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="krug"></div>
  <div class="krug"></div>
  <div class="krug"></div>

  <header class="top">
    <span id="korisnik" hidden></span>
    <div class="top-dugmad">
      <button class="mali" id="temaBtn" type="button">Tema</button>
      <button class="mali" id="odjava" type="button" hidden>Odjava</button>
    </div>
  </header>

  <section class="kartica auth" id="auth" hidden>
    <h1>Prijava</h1>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="lozinka" placeholder="Lozinka (min. 6 znakova)" autocomplete="current-password">
    <button class="akcija" id="prijavi" type="button">Prijavi se</button>
    <button class="sekundarno" id="registruj" type="button">Registruj se</button>
    <p id="authPoruka" class="poruka"></p>
  </section>

  <main class="wrap" id="app" hidden>
    <section class="kartica">
      <h1>Kalkulator</h1>
      <input type="text" id="izraz" class="ekran" readonly placeholder="0">

      <div class="tastatura">
        <button class="tipka fn" data-k="C">C</button>
        <button class="tipka fn" data-k="⌫">⌫</button>
        <button class="tipka op" data-k="√">√</button>
        <button class="tipka op" data-k="%">%</button>

        <button class="tipka" data-k="7">7</button>
        <button class="tipka" data-k="8">8</button>
        <button class="tipka" data-k="9">9</button>
        <button class="tipka op" data-k="/">÷</button>

        <button class="tipka" data-k="4">4</button>
        <button class="tipka" data-k="5">5</button>
        <button class="tipka" data-k="6">6</button>
        <button class="tipka op" data-k="*">×</button>

        <button class="tipka" data-k="1">1</button>
        <button class="tipka" data-k="2">2</button>
        <button class="tipka" data-k="3">3</button>
        <button class="tipka op" data-k="-">−</button>

        <button class="tipka op" data-k="ANS">ANS</button>
        <button class="tipka" data-k="0">0</button>
        <button class="tipka" data-k=".">.</button>
        <button class="tipka op" data-k="+">+</button>

        <button id="izracunaj" type="button">=</button>
      </div>

      <p id="rezultat" aria-live="polite"></p>
    </section>

    <section class="kartica">
      <h2>Zadnjih 10 računa</h2>
      <ul id="istorija"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    const dugme = document.getElementById("izracunaj");
    dugme.addEventListener("click", (e) => {
      const r = dugme.getBoundingClientRect();
      const span = document.createElement("span");
      const d = Math.max(r.width, r.height);
      span.className = "ripple";
      span.style.width = span.style.height = d + "px";
      span.style.left = (e.clientX - r.left - d / 2) + "px";
      span.style.top = (e.clientY - r.top - d / 2) + "px";
      dugme.appendChild(span);
      setTimeout(() => span.remove(), 600);
    });

    const rez = document.getElementById("rezultat");
    new MutationObserver(() => {
      rez.classList.remove("pojavi");
      void rez.offsetWidth;
      rez.classList.add("pojavi");
    }).observe(rez, { childList: true, characterData: true, subtree: true });
  </script>
</body>
</html>
