<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    .kalkulator {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 340px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
      text-align: center;
      color: #1e3c72;
    }

    .red {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 10px;
      font-size: 1.1rem;
      border: 2px solid #d0d7e2;
      border-radius: 8px;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #2a5298;
    }

    select {
      padding: 10px;
      font-size: 1.1rem;
      border: 2px solid #d0d7e2;
      border-radius: 8px;
      background: #f5f7fb;
      cursor: pointer;
    }

    #izracunaj {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      background: #2a5298;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #izracunaj:hover {
      background: #1e3c72;
    }

    #rezultat {
      margin: 20px 0 0;
      min-height: 2rem;
      font-size: 1.6rem;
      font-weight: bold;
      text-align: right;
      color: #1e3c72;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="kalkulator">
    <h1>Kalkulator</h1>

    <div class="red">
      <input type="number" id="a">
      <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="number" id="b">
    </div>

    <button id="izracunaj">=</button>
    <p id="rezultat"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
